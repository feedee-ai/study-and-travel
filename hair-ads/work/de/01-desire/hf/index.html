<!doctype html>

<head>

<style>
  @font-face { font-family: "Jost"; src: url("assets/fonts/Jost.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; background: transparent; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: #FAF7F2;
          font-family: "Jost", sans-serif; -webkit-font-smoothing: antialiased; }

  /* мягкие затемнения под текстом */
  .scrim-top { position: absolute; left: 0; right: 0; top: 0; height: 560px;
               background: linear-gradient(180deg, rgba(26,19,14,.48), rgba(26,19,14,0)); }
  .scrim-mid { position: absolute; left: -10%; right: -10%; top: 740px; height: 860px;
               background: radial-gradient(50% 50% at 50% 50%, rgba(26,19,14,.40), rgba(26,19,14,0)); }
  .scrim-bot { position: absolute; left: 0; right: 0; top: 1240px; height: 680px;
               background: linear-gradient(0deg, rgba(26,19,14,.42), rgba(26,19,14,0)); }
  .scrim-end { position: absolute; inset: 0; opacity: 0;
               background: linear-gradient(180deg, rgba(26,19,14,.50) 0%, rgba(26,19,14,.42) 33%, rgba(26,19,14,.06) 41%,
                           rgba(26,19,14,.06) 64%, rgba(26,19,14,.40) 70%, rgba(26,19,14,.40) 82%, rgba(26,19,14,.15) 100%); }

  /* постоянные элементы */
  .loc { position: absolute; top: 246px; left: 0; right: 0; display: flex; justify-content: center; align-items: center;
         gap: 18px; font-weight: 500; font-size: 37px; letter-spacing: .26em; padding-left: .26em;
         text-shadow: 0 0 22px rgba(20,14,10,.6), 0 1px 3px rgba(0,0,0,.35); opacity: 0; }
  .loc::before { content: ""; position: absolute; left: 50%; top: 50%; width: 640px; height: 150px; transform: translate(-50%,-50%);
                 background: radial-gradient(50% 50% at 50% 50%, rgba(26,19,14,.42), rgba(26,19,14,0)); z-index: -1; }
  .loc .hair { width: 58px; height: 1.5px; background: rgba(216,195,165,.95); }
  .pill { position: absolute; top: 1404px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 14px;
          padding: 18px 38px 18px 44px; border-radius: 999px; border: 1.5px solid rgba(250,247,242,.92);
          background: rgba(26,19,14,.42); font-weight: 500; font-size: 29px; letter-spacing: .3em; white-space: nowrap; opacity: 0; }

  /* заголовки */
  .h { position: absolute; left: 80px; right: 80px; top: 0; height: 1920px; display: flex; flex-direction: column;
       justify-content: center; align-items: center; text-align: center; }
  .h .line { display: block; font-weight: 300; font-size: 70px; line-height: 1.2; letter-spacing: .14em;
             padding-left: .14em; text-transform: uppercase; text-shadow: 0 2px 28px rgba(0,0,0,.30); white-space: nowrap; opacity: 0; }
  .h .line.sm { font-size: 64px; }
  .h .word { font-size: 84px; line-height: 1.32; letter-spacing: .22em; padding-left: .22em; }
  .h .rule { width: 72px; height: 1px; background: #D8C3A5; margin: 0 0 40px; transform: scaleX(0); }
  .h .svc { font-weight: 400; font-size: 46px; line-height: 1.55; letter-spacing: .24em; padding-left: .24em; }
  .h .dot { width: 6px; height: 6px; border-radius: 50%; background: #D8C3A5; margin: 6px 0; opacity: 0; }


  /* финальный CTA-кадр */
  .end { position: absolute; left: 60px; right: 60px; top: 0; height: 1920px; text-align: center; }
  /* финал (кадр с зеркалом): лицо мастера ~780–900 px, клиентки ~1170–1260 px — текст только выше и ниже */
  .end .kicker { position: absolute; left: 0; right: 0; top: 330px; }
  .end .cta { position: absolute; left: 0; right: 0; top: 525px; display: flex; flex-direction: column; align-items: center; }
  .end .foot { position: absolute; left: 0; right: 0; top: 1330px; display: flex; flex-direction: column; align-items: center; }
  .end .kicker, .end .bigpill, .end .bigloc, .end .svcline { opacity: 0; }
  .end .kicker { font-weight: 300; font-size: 66px; line-height: 1.2; letter-spacing: .14em; padding-left: .14em;
                 text-transform: uppercase; text-shadow: 0 2px 28px rgba(0,0,0,.3); }
  .end .bigpill { position: relative; overflow: hidden; display: flex; align-items: center; gap: 20px;
                  padding: 30px 60px 30px 70px; border-radius: 999px; background: #FAF7F2; color: #2A211C;
                  font-weight: 500; font-size: 44px; letter-spacing: .28em; white-space: nowrap;
                  box-shadow: 0 18px 50px rgba(0,0,0,.28); }
  .end .shine { position: absolute; top: -20%; bottom: -20%; width: 120px; left: -160px; opacity: 1;
                background: linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.75), rgba(255,255,255,0)); transform: skewX(-18deg); }
  .end .bigloc { margin-top: 0; display: flex; align-items: center; gap: 18px; font-weight: 500; font-size: 40px;
                 letter-spacing: .32em; padding-left: .32em; text-shadow: 0 1px 16px rgba(0,0,0,.35); }
  .end .bigloc .hair { width: 70px; height: 1px; background: #D8C3A5; }
  .end .svcline { margin-top: 18px; font-weight: 400; font-size: 25px; letter-spacing: .24em; padding-left: .24em; color: #EFE4D2; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-width="1080" data-height="1920" data-start="0" data-duration="22.3667" data-fps="30">

  <script>
    (function () {
      // Подложка v3 (plate.sh): k1 0 · k2 3.4 · k3 6.8 · k4 10.0–13.6 · k5 13.6–17.55 · k6 17.55; растворения 0.4 с; конец 22.37.
      const IN = { opacity: 0, y: 18, filter: "blur(8px)" };
      const ON = { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.85, ease: "expo.out", stagger: 0.14 };
      const OUT = { opacity: 0, filter: "blur(6px)", duration: 0.35, ease: "expo.in" };
      const tl = gsap.timeline({ paused: true });

      // постоянные: локация и пилюля
      tl.fromTo("#loc", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 1.0, ease: "expo.out" }, 0.15);
      tl.fromTo("#pill", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 1.0, ease: "expo.out" }, 0.35);

      tl.fromTo("#t1 .line", IN, ON, 0.45);
      tl.to("#t1 .line", OUT, 3.20);

      tl.fromTo("#t2 .line", IN, ON, 3.85);
      tl.to("#t2 .line", OUT, 6.60);

      tl.fromTo("#w1", IN, { ...ON, stagger: 0 }, 7.20);
      tl.fromTo("#w2", IN, { ...ON, stagger: 0 }, 8.00);
      tl.fromTo("#w3", IN, { ...ON, duration: 0.6, stagger: 0 }, 8.80);
      tl.to("#t3 .line", OUT, 9.80);

      tl.fromTo("#t4 .line", IN, ON, 10.45);
      tl.to("#t4 .line", OUT, 13.30);

      tl.to("#rule", { scaleX: 1, duration: 0.7, ease: "expo.out" }, 13.95);
      tl.fromTo(["#s1", "#d1", "#s2", "#d2", "#s3"], IN, { ...ON, stagger: 0.16 }, 14.05);
      tl.to(["#s1", "#d1", "#s2", "#d2", "#s3", "#rule"], OUT, 17.30);

      // финал: маленькие уходят, большой CTA-блок
      tl.to(["#loc", "#pill"], { opacity: 0, duration: 0.4, ease: "expo.in" }, 17.40);
      tl.to("#scrimEnd", { opacity: 1, duration: 0.9, ease: "sine.inOut" }, 17.50);
      tl.fromTo("#kick", IN, { ...ON, stagger: 0 }, 18.00);
      tl.fromTo("#bigpill", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.9, ease: "expo.out" }, 18.50);
      tl.fromTo("#bigloc", IN, { ...ON, stagger: 0 }, 18.85);
      tl.fromTo("#svcline", IN, { ...ON, stagger: 0 }, 19.10);
      tl.fromTo("#shine", { x: 0 }, { x: 760, duration: 1.1, ease: "expo.inOut" }, 19.75);
      tl.fromTo("#shine", { x: 0 }, { x: 760, duration: 1.1, ease: "expo.inOut", immediateRender: false }, 21.10);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    })();
