<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="assets/vendor/gsap.min.js"></script>
<style>
  @font-face { font-family: "Jost"; src: url("assets/fonts/Jost.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; background: transparent; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: #FAF7F2;
          font-family: "Jost", sans-serif; -webkit-font-smoothing: antialiased; }

  .scrim-top { position: absolute; left: 0; right: 0; top: 0; height: 560px;
               background: linear-gradient(180deg, rgba(26,19,14,.48), rgba(26,19,14,0)); }
  .scrim-mid { position: absolute; left: -10%; right: -10%; top: 640px; height: 960px;
               background: radial-gradient(50% 50% at 50% 50%, rgba(26,19,14,.44), rgba(26,19,14,0)); }
  .scrim-bot { position: absolute; left: 0; right: 0; top: 1260px; height: 660px;
               background: linear-gradient(0deg, rgba(26,19,14,.40), rgba(26,19,14,0)); }
  .scrim-light { position: absolute; left: 0; right: 0; top: 920px; height: 640px; opacity: 0;
                 background: radial-gradient(60% 50% at 50% 50%, rgba(250,247,242,.55), rgba(250,247,242,0)); }

  .loc { position: absolute; top: 246px; left: 0; right: 0; display: flex; justify-content: center; align-items: center;
         gap: 18px; font-weight: 500; font-size: 37px; letter-spacing: .26em; padding-left: .26em;
         text-shadow: 0 0 22px rgba(20,14,10,.6), 0 1px 3px rgba(0,0,0,.35); opacity: 0; }
  .glow { position: absolute; left: 50%; top: 268px; width: 640px; height: 150px; transform: translate(-50%,-50%);
          background: radial-gradient(50% 50% at 50% 50%, rgba(26,19,14,.42), rgba(26,19,14,0)); opacity: 0; }
  .loc .hair { width: 58px; height: 1.5px; background: rgba(216,195,165,.95); }
  .pill { position: absolute; top: 1404px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 14px;
          padding: 18px 38px 18px 44px; border-radius: 999px; border: 1.5px solid rgba(250,247,242,.92);
          background: rgba(26,19,14,.42); font-weight: 500; font-size: 29px; letter-spacing: .3em; white-space: nowrap; opacity: 0; }

  .ctr { position: absolute; left: 60px; right: 60px; top: 0; height: 1920px; display: flex; flex-direction: column;
         justify-content: center; align-items: center; text-align: center; }
  .line { display: block; font-weight: 300; font-size: 64px; line-height: 1.22; letter-spacing: .13em; padding-left: .13em;
          text-transform: uppercase; text-shadow: 0 2px 26px rgba(0,0,0,.34); white-space: nowrap; opacity: 0; }
  .acc { color: #EEDFC4; font-weight: 400; }

  /* 1 — циферблат: час проходит */
  #clock { position: absolute; left: 540px; top: 960px; width: 0; height: 0; opacity: 0; }
  #clock svg { position: absolute; left: -400px; top: -400px; width: 800px; height: 800px; overflow: visible; }
  #clock .ring { fill: none; stroke: rgba(250,247,242,.35); stroke-width: 1.5; }
  #clock .arc { fill: none; stroke: #D8C3A5; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
  #clock .tick { stroke: rgba(250,247,242,.55); stroke-width: 2; }
  #clock .hand { stroke: #FAF7F2; stroke-width: 2.4; stroke-linecap: round; }

  /* 2 — «меньше»: полосы сжимаются; 3 — «больше»: полоса растёт */
  .bar { width: 520px; height: 3px; margin: 18px auto 30px; background: rgba(250,247,242,.25); position: relative; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: #D8C3A5; transform-origin: 0 50%; }
  #t1 .line { font-size: 54px; letter-spacing: .12em; padding-left: .12em; line-height: 1.24; }
  #t1 .acc { font-size: 58px; }
  .t3bg { position: absolute; left: -10%; right: -10%; top: 300px; height: 620px; opacity: 0;
          background: radial-gradient(50% 50% at 50% 50%, rgba(26,19,14,.55), rgba(26,19,14,.25) 60%, rgba(26,19,14,0)); }
  #t3 { justify-content: flex-start; padding-top: 420px; box-sizing: border-box; }
  #t3 .line { font-size: 80px; letter-spacing: .16em; padding-left: .16em; }

  /* 4 — слова сменяют друг друга в одной точке */
  .swap { position: relative; height: 130px; width: 1080px; overflow: hidden;
          -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 12%, #000 88%, transparent 100%); }
  .swap .w { position: absolute; left: 0; right: 0; top: 0; font-weight: 300; font-size: 88px; line-height: 130px; letter-spacing: .18em;
             padding-left: .18em; text-transform: uppercase; text-align: center; text-shadow: 0 2px 26px rgba(0,0,0,.34); white-space: nowrap; }
  .swap .w.sm { font-size: 70px; letter-spacing: .14em; padding-left: .14em; }
  .dots { position: relative; display: flex; gap: 18px; justify-content: center; margin-top: 34px; opacity: 0; }
  .dots b { width: 10px; height: 10px; border-radius: 5px; background: rgba(250,247,242,.4); }
  .dots .ind { position: absolute; top: 0; left: 0; width: 30px; height: 10px; border-radius: 5px; background: #E4CFAE; }

  /* 5 — услуги: редакционный список с номерами и тонкими линиями */
  .idx { position: absolute; left: 150px; right: 150px; top: 640px; }
  .idxbg { position: absolute; left: 0; right: 0; top: 520px; height: 760px; opacity: 0;
           background: radial-gradient(70% 50% at 45% 50%, rgba(26,19,14,.62), rgba(26,19,14,.25) 70%, rgba(26,19,14,0)); }
  .idx .cap { font-weight: 500; font-size: 26px; letter-spacing: .42em; color: #F0DFC2; margin-bottom: 34px; opacity: 0;
              text-shadow: 0 1px 12px rgba(0,0,0,.4); }
  .idx .row { position: relative; display: flex; align-items: baseline; gap: 34px; padding: 26px 0; overflow: hidden; }
  .idx .row .n { font-weight: 500; font-size: 30px; letter-spacing: .16em; color: #F0DFC2; width: 52px; opacity: 0; text-shadow: 0 1px 12px rgba(0,0,0,.4); }
  .idx .row .t { font-weight: 300; font-size: 54px; letter-spacing: .2em; white-space: nowrap; text-shadow: 0 2px 22px rgba(0,0,0,.4); }
  .idx .rule { height: 1.5px; background: rgba(228,207,174,.85); transform: scaleX(0); transform-origin: 0 50%; }

  /* финал — светлая сцена: тёмный текст, тёмная пилюля */
  .end { position: absolute; left: 0; right: 0; top: 1010px; display: flex; flex-direction: column; align-items: center; color: #2A211C; }
  .end .kicker { font-weight: 400; font-size: 58px; line-height: 1.2; letter-spacing: .14em; padding-left: .14em; text-transform: uppercase;
                 text-align: center; margin-bottom: 34px; opacity: 0; }
  .end .bigpill { position: relative; overflow: hidden; display: flex; align-items: center; gap: 20px; opacity: 0;
                  padding: 30px 60px 30px 70px; border-radius: 999px; background: #2A211C; color: #FAF7F2;
                  font-weight: 500; font-size: 44px; letter-spacing: .28em; white-space: nowrap; box-shadow: 0 18px 50px rgba(42,33,28,.30); }
  .end .shine { position: absolute; top: -20%; bottom: -20%; width: 120px; left: -160px;
                background: linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.35), rgba(255,255,255,0)); transform: skewX(-18deg); }
  .end .bigloc { margin-top: 34px; display: flex; align-items: center; gap: 18px; font-weight: 500; font-size: 38px; opacity: 0;
                 letter-spacing: .32em; padding-left: .32em; }
  .end .bigloc .hair { width: 70px; height: 1.5px; background: #9C7F58; }
  .end .svcline { margin-top: 16px; font-weight: 500; font-size: 24px; letter-spacing: .24em; padding-left: .24em; color: #5A4A3E; opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-width="1080" data-height="1920" data-start="0" data-duration="24.4167" data-fps="30">
  <div class="scrim-top" id="scrimTop"></div>
  <div class="scrim-mid" id="scrimMid"></div>
  <div class="scrim-bot" id="scrimBot"></div>
  <div class="scrim-light" id="scrimLight"></div>

  <div class="glow" id="glow"></div>
  <div class="loc" id="loc">
    <span class="hair"></span>
    <svg width="27" height="36" viewBox="0 0 18 24" aria-hidden="true"><path d="M9 23s7.5-8.2 7.5-13.6A7.5 7.5 0 0 0 1.5 9.4C1.5 14.8 9 23 9 23z" fill="none" stroke="#D8C3A5" stroke-width="1.6"/><circle cx="9" cy="9.4" r="2.6" fill="#D8C3A5"/></svg>
    <span>ST. MORITZ</span>
    <span class="hair"></span>
  </div>

  <div id="clock"><svg viewBox="-400 -400 800 800">
    <defs><radialGradient id="disc"><stop offset="0" stop-color="#1A130E" stop-opacity=".55"/><stop offset=".8" stop-color="#1A130E" stop-opacity=".42"/><stop offset="1" stop-color="#1A130E" stop-opacity=".30"/></radialGradient></defs><circle r="378" fill="url(#disc)"/><circle class="ring" r="380"/>
    <g id="ticks"></g>
    <circle class="arc" id="arc" r="380" pathLength="1" transform="rotate(-90)"/>
    <g id="hand" style="opacity:0"><circle cx="0" cy="-380" r="9" fill="#F3E6CF"/></g>
  </svg></div>
  <div class="ctr" id="t1"><span class="line">Beautiful hair</span><span class="line">shouldn’t take</span><span class="line acc">an hour</span><span class="line">every morning</span></div>

  <div class="ctr" id="t2">
    <span class="line" id="l1">Less frizz.</span><div class="bar" id="b1"><i></i></div>
    <span class="line" id="l2">Less styling.</span><div class="bar" id="b2"><i></i></div>
  </div>

  <div class="t3bg" id="t3bg"></div>
  <div class="ctr" id="t3"><span class="line">More time</span><span class="line">for you.</span><div class="bar" id="b3"><i style="transform:scaleX(0)"></i></div></div>

  <div class="ctr" id="t4">
    <div class="swap"><span class="w" id="s1">Smooth</span><span class="w sm" id="s2">Easy to manage</span><span class="w" id="s3">Glossy</span></div>
    <div class="dots" id="dots"><b id="d1"></b><b id="d2"></b><b id="d3"></b><i class="ind" id="ind"></i></div>
  </div>

  <div class="idxbg" id="idxbg"></div>
  <div class="idx" id="t5">
    <div class="cap" id="icap">TREATMENTS</div>
    <div class="rule" id="ir0"></div>
    <div class="row"><span class="n" id="n1">01</span><span class="t" id="x1">KERATIN</span></div><div class="rule" id="ir1"></div>
    <div class="row"><span class="n" id="n2">02</span><span class="t" id="x2">HAIR BOTOX</span></div><div class="rule" id="ir2"></div>
    <div class="row"><span class="n" id="n3">03</span><span class="t" id="x3">HAIR RECOVERY</span></div><div class="rule" id="ir3"></div>
  </div>

  <div class="pill" id="pill">
    <span>DM TO BOOK</span>
    <svg width="25" height="22" viewBox="0 0 26 23" aria-hidden="true"><path d="M13 21.5S1.5 14.6 1.5 7.4A5.9 5.9 0 0 1 13 4.6a5.9 5.9 0 0 1 11.5 2.8C24.5 14.6 13 21.5 13 21.5z" fill="#FAF7F2"/></svg>
  </div>

  <div class="end">
    <div class="kicker" id="kick">Take back<br>your mornings.</div>
    <div class="bigpill" id="bigpill">
      <span>DM TO BOOK</span>
      <svg width="36" height="32" viewBox="0 0 26 23" aria-hidden="true"><path d="M13 21.5S1.5 14.6 1.5 7.4A5.9 5.9 0 0 1 13 4.6a5.9 5.9 0 0 1 11.5 2.8C24.5 14.6 13 21.5 13 21.5z" fill="#D8C3A5"/></svg>
      <span class="shine" id="shine"></span>
    </div>
    <div class="bigloc" id="bigloc">
      <span class="hair"></span>
      <svg width="28" height="37" viewBox="0 0 18 24" aria-hidden="true"><path d="M9 23s7.5-8.2 7.5-13.6A7.5 7.5 0 0 0 1.5 9.4C1.5 14.8 9 23 9 23z" fill="none" stroke="#9C7F58" stroke-width="1.5"/><circle cx="9" cy="9.4" r="2.5" fill="#9C7F58"/></svg>
      <span>ST. MORITZ</span>
      <span class="hair"></span>
    </div>
    <div class="svcline" id="svcline">KERATIN · HAIR BOTOX · HAIR RECOVERY</div>
  </div>

  <script>
    (function () {
      // Подложка (plate.sh): k1 0–4.25 · шторка вверх 4.25 · k2 4.25–7.1 · k3 7.1 · k4 10.7 · k5 13.7 · k6 17.5; конец 22.5
      const ticks = document.getElementById("ticks");
      for (let i = 0; i < 12; i++) {
        const a = i * Math.PI / 6, r1 = 366, r2 = i % 3 === 0 ? 344 : 356;
        const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
        l.setAttribute("class", "tick");
        l.setAttribute("x1", (Math.sin(a) * r1).toFixed(1)); l.setAttribute("y1", (-Math.cos(a) * r1).toFixed(1));
        l.setAttribute("x2", (Math.sin(a) * r2).toFixed(1)); l.setAttribute("y2", (-Math.cos(a) * r2).toFixed(1));
        ticks.appendChild(l);
      }
      const IN = { opacity: 0, y: 18, filter: "blur(8px)" };
      const ON = { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "expo.out", stagger: 0.13 };
      const OUT = { opacity: 0, filter: "blur(6px)", duration: 0.35, ease: "expo.in" };
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(["#loc", "#glow"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 1.0, ease: "expo.out" }, 0.15);
      tl.fromTo("#pill", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 1.0, ease: "expo.out" }, 0.35);

      // 1 — час проходит по циферблату
      tl.fromTo("#clock", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.9, ease: "expo.out" }, 0.25);
      tl.fromTo("#t1 .line", IN, ON, 0.45);
      tl.to("#arc", { strokeDashoffset: 0, duration: 3.0, ease: "sine.inOut" }, 0.7);
      tl.set("#hand", { opacity: 1 }, 0.7);
      tl.fromTo("#hand", { rotation: 0, svgOrigin: "0 0" }, { rotation: 360, svgOrigin: "0 0", duration: 3.0, ease: "sine.inOut" }, 0.7);
      tl.to(["#t1 .line", "#clock"], OUT, 4.05);

      // 2 — «меньше»: полосы сжимаются
      tl.fromTo("#l1", IN, { ...ON, stagger: 0 }, 4.75);
      tl.fromTo("#b1", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 4.85);
      tl.fromTo("#b1 i", { scaleX: 1 }, { scaleX: 0.18, duration: 1.1, ease: "expo.inOut" }, 5.1);
      tl.fromTo("#l2", IN, { ...ON, stagger: 0 }, 5.55);
      tl.fromTo("#b2", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 5.65);
      tl.fromTo("#b2 i", { scaleX: 1 }, { scaleX: 0.18, duration: 1.1, ease: "expo.inOut" }, 5.9);
      tl.to(["#l1", "#l2", "#b1", "#b2"], OUT, 6.95);

      // 3 — «больше»: полоса растёт
      tl.to("#t3bg", { opacity: 1, duration: 0.7, ease: "sine.inOut" }, 7.3);
      tl.fromTo("#t3 .line", IN, ON, 7.6);
      tl.fromTo("#b3", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 7.9);
      tl.to("#b3 i", { scaleX: 1, duration: 1.6, ease: "expo.inOut" }, 8.1);
      tl.to(["#t3 .line", "#b3"], OUT, 10.55);
      tl.to("#t3bg", { opacity: 0, duration: 0.5, ease: "sine.inOut" }, 10.6);

      // 4 — слова сменяют друг друга
      // слайдер: каждое слово ~0.9 с в полном виде; переход 0.8 с — уходит влево, следующее въезжает справа
      const W = ["#s1", "#s2", "#s3"];
      gsap.set(W, { xPercent: 100, opacity: 0 });
      tl.fromTo("#dots", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "sine.inOut" }, 10.95);
      tl.to("#s1", { xPercent: 0, opacity: 1, duration: 0.9, ease: "expo.out" }, 11.0);
      [[0, 1, 12.15], [1, 2, 13.85]].forEach(([a, b, t]) => {
        tl.set(W[b], { opacity: 1 }, t);
        tl.to(W[a], { xPercent: -100, duration: 0.8, ease: "sine.inOut" }, t);
        tl.to(W[b], { xPercent: 0, duration: 0.8, ease: "sine.inOut" }, t);
        tl.set(W[a], { opacity: 0 }, t + 0.81);
        tl.to("#ind", { x: 28 * b, duration: 0.8, ease: "sine.inOut" }, t);
      });
      tl.to(["#s3", "#dots"], OUT, 15.55);

      // 5 — услуги-чипы
      gsap.set(["#x1", "#x2", "#x3"], { yPercent: 110, opacity: 0 });
      tl.to("#idxbg", { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 15.8);
      tl.to("#idxbg", { opacity: 0, duration: 0.6, ease: "sine.inOut" }, 19.25);
      tl.fromTo("#icap", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.8, ease: "expo.out" }, 16);
      tl.to("#ir0", { scaleX: 1, duration: 0.9, ease: "expo.inOut" }, 16.1);
      [1, 2, 3].forEach((k) => {
        const t = 16.25 + (k - 1) * 0.3;
        tl.to("#x" + k, { yPercent: 0, opacity: 1, duration: 0.9, ease: "expo.out" }, t);
        tl.fromTo("#n" + k, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "sine.inOut" }, t + 0.1);
        tl.to("#ir" + k, { scaleX: 1, duration: 0.9, ease: "expo.inOut" }, t + 0.1);
      });
      tl.to(["#icap", "#ir0", "#n1", "#n2", "#n3", "#x1", "#x2", "#x3", "#ir1", "#ir2", "#ir3"], OUT, 19.25);

      // финал — светлая сцена
      tl.to(["#loc", "#glow", "#pill"], { opacity: 0, duration: 0.45, ease: "expo.in" }, 19.3);
      tl.to(["#scrimTop", "#scrimMid", "#scrimBot"], { opacity: 0, duration: 0.8, ease: "sine.inOut" }, 19.4);
      tl.to("#scrimLight", { opacity: 1, duration: 0.9, ease: "sine.inOut" }, 19.5);
      tl.fromTo("#kick", IN, { ...ON, stagger: 0 }, 20);
      tl.fromTo("#bigpill", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.9, ease: "expo.out" }, 20.5);
      tl.fromTo("#bigloc", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.85, ease: "expo.out" }, 20.85);
      tl.fromTo("#svcline", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.85, ease: "expo.out" }, 21.1);
      tl.fromTo("#shine", { x: 0 }, { x: 760, duration: 1.1, ease: "expo.inOut" }, 21.7);
      tl.fromTo("#shine", { x: 0 }, { x: 760, duration: 1.1, ease: "expo.inOut", immediateRender: false }, 23.1);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    })();
  </script>
</div>
</body>
</html>
